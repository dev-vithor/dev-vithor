name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 3 * * *" # todo dia à meia-noite de Teresina (UTC-3)
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Token: se existir o secret STATS_PAT (PAT classic com escopos repo + read:user),
      # os cards contam também os repositórios privados. Sem ele, usa só dados públicos.
      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            {"show_icons":true,"include_all_commits":true,"count_private":true,
            "hide_border":true,"bg_color":"0D1117","title_color":"00F0FF",
            "icon_color":"7F00FF","text_color":"C9D1D9","ring_color":"7F00FF",
            "locale":"pt-br"}
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      - name: Card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            {"layout":"compact","langs_count":8,"hide_border":true,
            "bg_color":"0D1117","title_color":"00F0FF","text_color":"C9D1D9",
            "locale":"pt-br"}
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      # Roda por último: a action roda em container e grava na pasta profile/ já criada acima.
      - name: Cobrinha do gráfico de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#7F00FF&color_dots=#ebedf0,#d6c8ff,#a98bff,#7f4dff,#5b2bff
            profile/snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#161b22,#2d1b5e,#4b2a9e,#7f3dff,#b57cff

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualiza cards do perfil" || exit 0
          git pull --rebase
          git push
